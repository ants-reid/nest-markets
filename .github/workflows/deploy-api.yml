name: Deploy — API

on:
  push:
    branches: [main]
    paths:
      - "apps/api/**"

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run tests before deploy
        working-directory: apps/api
        run: |
          pip install -r requirements.txt
          python -m pytest tests/ -q --tb=short

      - name: Build Docker image
        run: |
          docker build -f infra/docker/Dockerfile.api -t market-hunter-api:${{ github.sha }} .

      - name: Push Docker image
        run: |
          echo "Push step — configure registry credentials in environment secrets"
          # docker push market-hunter-api:${{ github.sha }}

      - name: Run migrations
        run: |
          echo "Run: scripts/db/migrate.sh after deployment"
