[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "market-hunter-api"
version = "0.1.0"
description = "Backend API for Market Hunter MVP"
requires-python = ">=3.12"
dependencies = [
	"fastapi>=0.115.0",
	"uvicorn[standard]>=0.30.0",
	"sqlalchemy>=2.0.0",
	"psycopg[binary]>=3.2.0",
	"pydantic>=2.8.0",
	"pydantic-settings>=2.4.0",
	"jsonschema>=4.23.0",
	"alembic>=1.13.2",
        "apscheduler>=3.10",
        "slowapi>=0.1.9",
        "yfinance>=0.2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "httpx>=0.27.0",
  "ruff>=0.6.0",
]

[tool.setuptools]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["app/tests"]
pythonpath = ["."]
